<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taquería El Fili</title>
<meta name="description" content="Menú digital, redes sociales y reseñas de Taquería El Fili.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Creepster&family=Figtree:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
/* Layout: columna única tipo celular; rótulo de taquería arriba, papel picado,
   botones de redes, pestañas fijas por categoría y lista de platillos. */
:root {
  --bg: #fffdf8;
  --surface: #ffffff;
  --fg: #1f1a16;
  --muted: #6e625a;
  --line: #ece4da;
  --accent: #c4161c;      /* rojo del logo */
  --accent-fg: #ffffff;
  --accent-2: #9a6a00;    /* dorado del logo, oscurecido para leerse sobre claro */
  --price: #1f1a16;
  --picado-1: #c4161c; --picado-2: #f2b705; --picado-3: #0d7a4f; --picado-4: #d6006f;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-temporada]) {
    --bg: #17120f; --surface: #221b17; --fg: #f6eee6; --muted: #b5a79c; --line: #3a2f28;
    --accent: #ff5a4f; --accent-fg: #1a0605; --accent-2: #f2b705; --price: #f6eee6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-temporada]) {
  --bg: #17120f; --surface: #221b17; --fg: #f6eee6; --muted: #b5a79c; --line: #3a2f28;
  --accent: #ff5a4f; --accent-fg: #1a0605; --accent-2: #f2b705; --price: #f6eee6;
  color-scheme: dark;
}

/* Temas de temporada: cada uno tiene un solo look, sin modo claro/oscuro. */
:root[data-temporada="patrias"] {
  --bg: #fbfbf7; --surface: #ffffff; --fg: #14241b; --muted: #5d6b61; --line: #e3e7df;
  --accent: #c8102e; --accent-fg: #fff; --accent-2: #006847; --price: #14241b;
  --picado-1: #006847; --picado-2: #ffffff; --picado-3: #c8102e; --picado-4: #006847;
  color-scheme: light;
}
:root[data-temporada="halloween"] {
  --bg: #120d18; --surface: #1d1526; --fg: #f3ecf8; --muted: #a998b8; --line: #33263f;
  --accent: #ff7a1a; --accent-fg: #1a0b00; --accent-2: #a6e22e; --price: #ffb067;
  --picado-1: #ff7a1a; --picado-2: #7b3fb5; --picado-3: #a6e22e; --picado-4: #ff7a1a;
  color-scheme: dark;
}
:root[data-temporada="muertos"] {
  --bg: #1e0f2e; --surface: #2a1740; --fg: #fff3e6; --muted: #c9b2d9; --line: #43285c;
  --accent: #ffa400; --accent-fg: #2a1300; --accent-2: #ff3d8b; --price: #ffc65c;
  --picado-1: #ff3d8b; --picado-2: #ffa400; --picado-3: #7ad3ff; --picado-4: #b06cff;
  color-scheme: dark;
}
:root[data-temporada="navidad"] {
  --bg: #0d3326; --surface: #134232; --fg: #fbf6ec; --muted: #b6cfc2; --line: #21584388;
  --accent: #e63946; --accent-fg: #fff; --accent-2: #f2c14e; --price: #f2c14e;
  --picado-1: #e63946; --picado-2: #f2c14e; --picado-3: #fbf6ec; --picado-4: #e63946;
  color-scheme: dark;
}
:root[data-temporada="halloween"] .rotulo h1 { font-family: "Creepster", var(--display); letter-spacing: .04em; }
:root[data-temporada="navidad"] .rotulo h1 { font-family: "Fraunces", Georgia, serif; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  transition: background-color .3s, color .3s;
}
.pagina { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* Papel picado: banderitas recortadas con colores del tema */
.picado { display: flex; height: 34px; margin-inline: -16px; overflow: hidden; }
.picado span {
  flex: 1; min-width: 0;
  clip-path: polygon(0 0, 100% 0, 100% 72%, 75% 100%, 50% 72%, 25% 100%, 0 72%);
  -webkit-mask: radial-gradient(circle at 50% 38%, transparent 3px, #000 3.5px);
          mask: radial-gradient(circle at 50% 38%, transparent 3px, #000 3.5px);
}
.picado span:nth-child(4n+1) { background: var(--picado-1); }
.picado span:nth-child(4n+2) { background: var(--picado-2); }
.picado span:nth-child(4n+3) { background: var(--picado-3); }
.picado span:nth-child(4n)   { background: var(--picado-4); }
:root[data-temporada="patrias"] .picado span:nth-child(4n+2) { outline: 1px solid var(--line); }

.rotulo { padding-block: 22px 8px; display: grid; gap: 6px; }
.rotulo .temporada { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); }
.rotulo h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(2.1rem, 10vw, 3rem); line-height: 1; color: var(--accent);
  text-wrap: balance;
}
.rotulo p { margin: 0; color: var(--muted); }
.estado { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 14px; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
  font-size: 13px; font-weight: 700; border: 1px solid var(--line); color: var(--fg);
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.abierto::before { background: #22b35e; }
.chip.cerrado::before { background: #e5484d; }

/* Botones de redes */
.enlaces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-block: 18px; }
.enlaces a {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px;
  border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); text-decoration: none; font-weight: 700; font-size: 15px;
}
.enlaces a svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
.enlaces a.principal { grid-column: 1 / -1; background: var(--accent); color: var(--accent-fg); border-color: transparent; justify-content: center; font-size: 17px; }
.enlaces a:focus-visible, .tabs a:focus-visible, .demo button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* Especiales de temporada */
.especiales { margin-block: 8px 4px; padding: 16px; border-radius: var(--radius); background: var(--accent); color: var(--accent-fg); }
.especiales h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 10px; letter-spacing: .02em; }
.especiales .platillo { border-color: color-mix(in srgb, var(--accent-fg) 25%, transparent); }
.especiales .platillo .desc, .especiales .platillo .precio { color: var(--accent-fg); }
.especiales .platillo .precio { color: var(--accent-fg); }

/* Pestañas */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin-inline: -16px; padding: 10px 16px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; padding: 7px 14px; border-radius: 99px; font-weight: 700; font-size: 14px;
  color: var(--fg); text-decoration: none; border: 1px solid var(--line);
}
.tabs a.activa { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.categoria { padding-top: 22px; }
.categoria h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--fg); }
.categoria .nota { margin: 4px 0 6px; color: var(--muted); font-size: 14px; }

.platillo { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.platillo:last-child { border-bottom: 0; }
.foto {
  width: 76px; height: 76px; border-radius: 12px; object-fit: cover; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  color: var(--accent); font-family: var(--display); font-size: 28px;
}
.especiales .foto { background: color-mix(in srgb, var(--accent-fg) 18%, transparent); color: var(--accent-fg); }
.platillo h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.25; }
.platillo .desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.platillo .precio { font-weight: 800; font-size: 17px; color: var(--price); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 1px 7px; border-radius: 6px; background: var(--line); color: var(--fg); }
.tag.picante { background: #e5484d; color: #fff; }
.tag.favorito { background: var(--accent-2); color: var(--bg); }

.pie { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
.aviso { margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--muted); font-size: 13px; color: var(--muted); }

/* Selector de temas (solo en modo demo) */
.demo { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.demo button { font: inherit; font-weight: 700; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.demo button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
</style>
</head>
<body>
<div class="pagina">
  <div class="picado" aria-hidden="true" id="picado"></div>

  <header class="rotulo">
    <span class="temporada" id="temporada-nombre"></span>
    <h1 id="nombre"></h1>
    <p id="lema"></p>
    <div class="estado"><span class="chip" id="abierto"></span><span id="horario"></span></div>
  </header>

  <nav class="enlaces" id="enlaces" aria-label="Redes y contacto"></nav>

  <section class="especiales" id="especiales" hidden>
    <h2 id="especiales-titulo"></h2>
    <div id="especiales-lista"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Categorías del menú"></nav>
  <main id="menu"></main>

  <footer class="pie" id="pie"></footer>
</div>

<script src="datos.js"></script>
<script>
(function () {
  var D = window.TAQUERIA;
  var $ = function (id) { return document.getElementById(id); };
  var TEMAS = ["normal", "patrias", "halloween", "muertos", "navidad"];

  var ICONOS = {
    menu: '<path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/>',
    instagram: '<path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM12 3.6c2.7 0 3 0 4.1.1 2.7.1 4 1.4 4.1 4.1.1 1.1.1 1.4.1 4.1s0 3-.1 4.1c-.1 2.7-1.4 4-4.1 4.1-1.1.1-1.4.1-4.1.1s-3 0-4.1-.1c-2.7-.1-4-1.4-4.1-4.1C3.7 15 3.6 14.7 3.6 12s0-3 .1-4.1C3.8 5.2 5.1 3.9 7.9 3.8 9 3.6 9.3 3.6 12 3.6zM12 2C9.3 2 8.9 2 7.9 2.1 4.2 2.3 2.3 4.2 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.2 3.7 2.1 5.6 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c3.7-.2 5.6-2.1 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.2-3.7-2.1-5.6-5.8-5.8C15.1 2 14.7 2 12 2z"/>',
    tiktok: '<path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .8.1V9a6.3 6.3 0 1 0 5.4 6.2V8.6a7.9 7.9 0 0 0 4.4 1.4V6.7a4.5 4.5 0 0 1-4.4-4.7z"/>',
    facebook: '<path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/>',
    maps: '<path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>',
    resena: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>',
    whatsapp: '<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/>'
  };
  function icono(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONOS[n] + '</svg>'; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function precio(n) { return "$" + n; }

  // Elegir temporada: #hash > valor fijo > automático por fecha
  function temporadaPorFecha(fecha) {
    var md = String(fecha.getMonth() + 1).padStart(2, "0") + "-" + String(fecha.getDate()).padStart(2, "0");
    for (var k in D.temporadas) {
      var t = D.temporadas[k];
      if (!t.desde) continue;
      var dentro = t.desde <= t.hasta ? (md >= t.desde && md <= t.hasta) : (md >= t.desde || md <= t.hasta);
      if (dentro) return k;
    }
    return "normal";
  }
  function temporadaInicial() {
    var h = location.hash.replace("#", "");
    if (TEMAS.indexOf(h) > -1) return h;
    if (D.temporada && D.temporada !== "auto") return D.temporada;
    return temporadaPorFecha(new Date());
  }

  function aMinutos(hhmm) { var p = hhmm.split(":"); return +p[0] * 60 + +p[1]; }
  function estaAbierto(ahora) {
    var min = ahora.getHours() * 60 + ahora.getMinutes();
    var hoy = D.negocio.horario[ahora.getDay()];
    var ayer = D.negocio.horario[(ahora.getDay() + 6) % 7];
    // Turno de ayer que cruza la medianoche
    if (ayer && aMinutos(ayer[1]) < aMinutos(ayer[0]) && min < aMinutos(ayer[1])) return true;
    if (!hoy) return false;
    var a = aMinutos(hoy[0]), c = aMinutos(hoy[1]);
    return c > a ? (min >= a && min < c) : min >= a;
  }

  function platilloHTML(p) {
    var foto = p.foto
      ? '<img class="foto" src="' + esc(p.foto) + '" alt="' + esc(p.nombre) + '" loading="lazy" width="76" height="76">'
      : '<div class="foto" aria-hidden="true">' + esc(p.nombre.charAt(0)) + '</div>';
    var tags = (p.tags || []).map(function (t) { return '<span class="tag ' + esc(t) + '">' + esc(t) + '</span>'; }).join("");
    return '<article class="platillo">' + foto +
      '<div><h3>' + esc(p.nombre) + '</h3>' +
      (p.descripcion ? '<p class="desc">' + esc(p.descripcion) + '</p>' : "") +
      (tags ? '<div class="tags">' + tags + '</div>' : "") + '</div>' +
      '<span class="precio">' + precio(p.precio) + '</span></article>';
  }

  function pintarFijo() {
    var n = D.negocio;
    document.title = n.nombre;
    $("nombre").textContent = n.nombre;
    $("lema").textContent = n.lema;
    $("horario").textContent = n.horarioTexto;
    var ab = estaAbierto(new Date());
    $("abierto").textContent = ab ? "Abierto ahora" : "Cerrado ahora";
    $("abierto").className = "chip " + (ab ? "abierto" : "cerrado");

    $("picado").innerHTML = new Array(14).join("<span></span>");

    var e = D.enlaces, botones = [
      ["menu", "#menu", "Ver el menú", true],
      ["instagram", e.instagram, "Instagram"],
      ["tiktok", e.tiktok, "TikTok"],
      ["facebook", e.facebook, "Facebook"],
      ["maps", e.maps, "Cómo llegar"],
      ["resena", e.resena, "Déjanos tu reseña"],
      ["whatsapp", e.whatsapp, "WhatsApp"]
    ];
    $("enlaces").innerHTML = botones.filter(function (b) { return b[1]; }).map(function (b) {
      var externo = b[1].charAt(0) !== "#";
      return '<a href="' + esc(b[1]) + '"' + (b[3] ? ' class="principal"' : "") +
        (externo ? ' target="_blank" rel="noopener"' : "") + '>' + icono(b[0]) + esc(b[2]) + '</a>';
    }).join("");

    $("tabs").innerHTML = D.categorias.map(function (c, i) {
      return '<a href="#' + esc(c.id) + '"' + (i === 0 ? ' class="activa"' : "") + '>' + esc(c.nombre) + '</a>';
    }).join("");
    $("menu").innerHTML = D.categorias.map(function (c) {
      return '<section class="categoria" id="' + esc(c.id) + '"><h2>' + esc(c.nombre) + '</h2>' +
        (c.nota ? '<p class="nota">' + esc(c.nota) + '</p>' : "") +
        c.platillos.map(platilloHTML).join("") + '</section>';
    }).join("");

    var pie = '<strong>' + esc(n.nombre) + '</strong><span>' + esc(n.direccion) + '</span>' +
      (n.telefono ? '<span>Tel. ' + esc(n.telefono) + '</span>' : "") +
      '<span>Precios en pesos mexicanos, IVA incluido. Sujetos a cambio sin previo aviso.</span>';
    if (D.modoDemo) {
      pie += '<div class="aviso">Versión de muestra: platillos y precios de ejemplo.</div>' +
        '<div class="demo" role="group" aria-label="Probar temas">Probar tema: ' +
        TEMAS.map(function (t) { return '<button type="button" data-tema="' + t + '">' + esc(D.temporadas[t].nombre) + '</button>'; }).join("") + '</div>';
    }
    $("pie").innerHTML = pie;
    $("pie").addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-tema]");
      if (b) aplicarTemporada(b.getAttribute("data-tema"));
    });
  }

  function aplicarTemporada(t) {
    var datos = D.temporadas[t] || D.temporadas.normal;
    if (t === "normal") document.documentElement.removeAttribute("data-temporada");
    else document.documentElement.setAttribute("data-temporada", t);
    $("temporada-nombre").textContent = datos.nombre;
    var esp = datos.especiales || [];
    $("especiales").hidden = esp.length === 0;
    $("especiales-titulo").textContent = "Especiales · " + datos.nombre;
    $("especiales-lista").innerHTML = esp.map(platilloHTML).join("");
    document.querySelectorAll(".demo button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-tema") === t ? "true" : "false");
    });
  }

  // Resaltar la pestaña de la categoría visible
  function seguirScroll() {
    var tabs = document.querySelectorAll(".tabs a");
    if (!("IntersectionObserver" in window)) return;
    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (en) {
        if (!en.isIntersecting) return;
        tabs.forEach(function (a) {
          var activa = a.getAttribute("href") === "#" + en.target.id;
          a.classList.toggle("activa", activa);
          if (activa) a.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      });
    }, { rootMargin: "-30% 0px -60% 0px" });
    document.querySelectorAll(".categoria").forEach(function (s) { obs.observe(s); });
  }

  pintarFijo();
  aplicarTemporada(temporadaInicial());
  seguirScroll();
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "");
    if (TEMAS.indexOf(h) > -1) aplicarTemporada(h);
  });
})();
</script>
</body>
</html>
